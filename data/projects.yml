# 个人主页项目数据
# 数据模型遵循：
#   engines    -> 基础引擎列表（独立仓库，仅作 SDK/运行时）
#   products   -> 派生产品列表（必须通过 parent 挂在某引擎下）
#
# 扩展规则：新增产品只需在 products 追加一段；新增版本在产品的 versions 数组追加。
# 新增引擎在 engines 追加。所有前端渲染自动按 parent 归类。

profile:
  name: kkutysllb
  name_zh: 金融扫地僧
  tagline: 麒麟启瑞，破局之锋
  tagline_zh: 麒麟启瑞，破局之锋
  bio_zh: |
    独立开发者，构建 **一套 Agent 基础设施 + N 套衍生产品**。

    ## QiLin（麒麟）
    **面向生产环境的 Python 智能体运行时引擎**（agent harness engine），基于 `LangGraph` 构建。一个卷积分身三种形态：嵌入式（进程内 LangGraph 执行器）即用、服务化（`LangGraph Server` 部署）即起、客户端调用（Python SDK）即接。

    同一运行时可同时跑在桌面端、Web API、也能嵌进 IDE 插件。

    ## 产品矩阵
    - **🖥️ KWorks** · Local-first AI Workspace，QiLin 桌面旗舰
    - **📈 KStock** · 跨平台桌面股票量化智能体（A 股 / 港股 / 美股 / 期货 / 期权）
    - **🧰 KSkills** · 跨平台技能包仓库，覆盖软件工程 / 金融量化 / 内容创作 / 深度研究 / 跨领域公共 / 办公文档 6 大领域（数据由 GitHub Actions 自动同步）

    ## 核心能力
    - **🔄 双模运行时** — embedded / service 两种部署形态无缝切换
    - **🧠 多智能体编排** — `AgentHandoff` + `OrchestratorGraph` + `AgentInbox`（v2.0.0 新增）
    - **🛡️ 可插拔沙箱** — 5 种执行后端（`local` / `aio_sandbox` / `boxlite` / `e2b` / `tenki`）
    - **🗄️ 多后端持久化** — SQLite / PostgreSQL + `Alembic` 迁移
    - **📊 观测与治理** — `Casbin` RBAC + `Langfuse` + `Monocle` 双追踪 + `skillscan` 静态扫描
    - **🔌 协议与集成** — MCP / ACP 协议 + GitHub / GitLab / Notion / Slack

    ## 设计信条
    每一个 token 都应有 ROI。不重复发送工具 schema，不保留失控输出，不错过任何可命中的稳定前缀。
  bio_en: |
    I build QiLin — a production-grade Python agent harness engine
    built on LangGraph, unifying dual-mode runtime, sub-agent composition,
    pluggable sandbox, multi-backend persistence and dual tracing.

    This page is the entry point to my public engines and products.
  avatar: /assets/avatar.svg
  links:
    github: https://github.com/kkutysllb

engines:
  - id: qilin
    name: 麒麟引擎
    name_en: QiLin
    tagline: 独立多 Agent 框架 · 骨架不变，血肉万变
    tagline_en: Independent Multi-Agent Framework
    description: |
      **QiLin（麒麟）是一个面向生产环境的 Python 智能体运行时引擎**（agent harness engine），基于 `LangGraph` 构建，将模型调用、工具执行、子智能体协作、沙箱隔离、记忆与可观测性整合在同一个可插拔运行时之内，既可作为嵌入式客户端直接调用，也可以作为独立服务通过 HTTP/SDK 对外暴露。

      **核心目标**：让同一套代码既能在进程内跑（embedded mode），也能在 `LangGraph Server` 上跑（service mode），最大化每一 token 的 ROI。

      ## v1.0.0 · 单智能体基座（2026-07-29 发布）

      首个稳定版本，定位为 **单智能体框架**（lead agent + 工具式子代理委派）。奠定了 20 个核心子系统（agents / runtime / sandbox / persistence / tracing / skills / mcp / …）、5 种可插拔沙箱（`local` / `aio_sandbox` / `boxlite` / `e2b` / `tenki`）、SQLite / PostgreSQL 多后端持久化 + `Alembic` 迁移、`Casbin` RBAC、`Langfuse` + `Monocle` 双追踪、Skill 市场 + `skillscan` 静态扫描 等能力基线。

      ## v2.0.0 · 多智能体 + 完整服务面（2026-08-10 发布）⭐ 当前版本

      在 v1.0.0 单智能体基座上完成两大跨越：

      **🧭 多智能体编排**：`AgentHandoff` 结构化上下文转移协议 + `OrchestratorGraph`（1 orchestrator + N worker 节点，按 `to_agent` 路由）+ `AgentInbox` 消息总线 + `orchestrator_workers` 并行分派 + `peer_consensus` 对等观点汇聚；通过 `orchestration.mode: single | multi` 切换（v1 行为完全保留，向后兼容）。

      **🌐 完整服务面**：HTTP Agent Server（`app/gateway`，FastAPI + uvicorn，20+ REST 路由）+ OpenAI Assistants API 兼容面 + **8 大 IM 渠道**（飞书 / Discord / Slack / Telegram / 钉钉 / 企微 / 微信 / GitHub）+ GitHub App webhook。

      **🔧 工程与质量**：测试基线 54 → **266 tests** · mypy 错误 525 → 284（19 个模块清零，CI 新增 clean-module 白名单门禁）· 引入 `uv.lock` 依赖锁定 · `config_version` 32。

      ## v1.0.0 vs v2.0.0 关键差异

      - **智能体模型**：v1.0.0 单智能体（lead agent）→ v2.0.0 单/多智能体可切换（`orchestration.mode`）
      - **HTTP 服务**：v1.0.0 无 → v2.0.0 20+ REST 路由 + OpenAI Assistants API 兼容
      - **IM 渠道**：v1.0.0 无 → v2.0.0 8 大 IM（飞书 / Discord / Slack / Telegram / 钉钉 / 企微 / 微信 / GitHub）
      - **测试覆盖**：v1.0.0 54 tests → v2.0.0 266 tests
      - **部署形态**：v1.0.0 嵌入式 + service → v2.0.0 嵌入式 + 完整服务面（HTTP Server + IM 渠道 + Scheduler）
      - **适用场景**：v1.0.0 嵌入式 SDK / 单 agent 应用 → v2.0.0 完整多 agent 产品 / 团队协作 / SaaS 化部署

      Python 包名 `qilin`，CLI 命令 `qilin` / `qilin-serve`，要求 Python >= 3.12。
    icon: /assets/qilin.svg
    color: "#41D1AB"
    repo: kkutysllb/QiLin
    homepage: https://github.com/kkutysllb/QiLin
    install:
      - type: pip
        label: 安装核心包
        command: pip install qilin
      - type: extras
        label: 可选扩展
        command: pip install 'qilin[postgres]' 'qilin[redis]' 'qilin[tui]' 'qilin[boxlite]' 'qilin[monocle]' 'qilin[browser]'
      - type: git
        label: 克隆源码
        command: git clone https://github.com/kkutysllb/QiLin.git && cd QiLin && pip install -e .
    features:
      - title: 双模运行时引擎
        icon: 🔄
        desc: 同一套代码同时支持 embedded 模式（进程内 LangGraph 执行器）与 service 模式（LangGraph Server 部署），运行时按场景无缝切换
      - title: 子智能体一等公民
        icon: 🧠
        desc: 子智能体拥有独立 checkpoint、token 计量与状态契约，递归调用不需要 ad-hoc hack，结构化协作
      - title: 可插拔沙箱（5 种）
        icon: 🛡️
        desc: 同一接口下抽象 local / aio_sandbox / boxlite / e2b / tenki 五种执行后端，按隔离级别与场景自由切换
      - title: 多后端持久化 + RBAC
        icon: 🗄️
        desc: SQLite（开发）与 PostgreSQL（生产）同一仓储接口，内置 Alembic 迁移；基于 Casbin 的资源级 RBAC 授权
      - title: 双追踪观测
        icon: 📊
        desc: 同一 trace 同时往 Langfuse 与 Monocle 推送观测数据，开发态与生产态观测体验一致
      - title: Skill 市场 + MCP/ACP
        icon: 🧩
        desc: Markdown 技能包 + 双层审阅 + skillscan 安全静态扫描；MCP 接入外部工具、ACP 跨进程智能体调用

  - id: deepseek-harness
    name: DeepSeek Harness
    name_en: DeepSeek Harness
    tagline: 一切皆插件 · Agent = Model + Harness
    tagline_en: Everything is a Plugin
    description: |
      **DeepSeek Harness 是 DeepSeek 官方的 Agent 开发框架**（开发者预览版），核心理念是**"一切皆插件"**——基于 `Cordis` 插件系统构建，模型、工具、技能、会话、沙箱、存储、循环、调度、UI 等所有 Agent 能力均由插件组合而成，可自由替换、灵活重组，无需改动框架源码。

      ## 核心特性
      - **一切皆插件** — `Cordis` 内核只负责插件加载 / 卸载 / 依赖，Agent 能力全部由插件提供，通过服务与事件彼此协作
      - **运行有迹可循** — 仅追加会话日志（系统提示词 / 思维链 / 工具调用 / 子 Agent 调度），Trajectory 视图按来源查看，支持恢复、分叉、检索与回放
      - **多种运行模式** — 标准（完整编码 Agent）/ PTC（Code Mode SDK 组合多轮工具调用）/ 极简（bash + 编辑器双工具）/ 创造（插件实验与 preset 创作）
      - **安全沙箱** — 基于 Linux `landlock` 的原生 `landlock-run` 沙箱，安全运行不可信代码
      - **多形态交付** — Web UI / CLI（`dsh`）/ Python 绑定；运行时动态加载 Cordis 插件（自修改）

      ## 快速开始
      - 快速体验：`npx @deepseek-ai/dsh web`
      - 源码：`git clone https://github.com/deepseek-ai/deepseek-harness`
      - 技术栈：TypeScript（pnpm monorepo，221+ 包）+ Python + Rust；MIT 协议；当前 v0.1.0-rc.5
    icon: /assets/dsh.svg
    color: "#4D6BFE"
    repo: deepseek-ai/deepseek-harness
    homepage: https://github.com/deepseek-ai/deepseek-harness
    install:
      - type: npx
        label: 快速体验
        command: npx @deepseek-ai/dsh web
      - type: git
        label: 克隆源码
        command: git clone https://github.com/deepseek-ai/deepseek-harness && cd deepseek-harness && pnpm install
    features:
      - title: 一切皆插件
        icon: 🧩
        desc: Cordis 内核仅管理插件生命周期；模型 / 工具 / 技能 / 沙箱 / 存储 / UI 等能力全部由插件提供，配置层自由重组
      - title: 运行有迹可循
        icon: 📜
        desc: 仅追加会话日志 + Trajectory 视图，按来源查看系统提示词 / 思维链 / 工具调用，可恢复、分叉、回放
      - title: 多种运行模式
        icon: 🎛️
        desc: 标准 / PTC / 极简 / 创造四模式，从完整编码 Agent 到双工具基准测试自由切换
      - title: 安全沙箱
        icon: 🔒
        desc: Linux landlock-run 原生沙箱隔离不可信代码；本地沙箱开箱即用
      - title: 多形态交付
        icon: 📦
        desc: Web UI / dsh CLI / Python 绑定；运行时动态加载插件（自修改），可创建自定义 preset

  - id: kskills
    name: KSkills 技能包
    name_en: KSkills
    tagline: 跨平台技能仓库 · {N} 个开箱即用技能
    tagline_en: Cross-Platform Skill Pack Collection — {N} skills
    description: |
      **KSkills 是一套跨平台的技能包（Skill Pack）集合**，可安装到 Claude Code / OClaw / Qoder 等任意 Agent 平台。

      共收录 **{packs} 个技能包 / {files} 个 SKILL.md**，覆盖 6 大领域（数据由 GitHub Actions 自动同步自 KSkills 仓库，详见 `data/kskills.json`）。

      每个技能以 `SKILL.md`（YAML frontmatter + Markdown 指南）为唯一入口，支持独立打包为 `.skill` 压缩包，通过 `SKILL-MANIFEST.json` 校验分发。
