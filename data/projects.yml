                file_glob: "*-arm64.dmg"
                icon: apple
              - name: Windows
                file_glob: "DSH.Desktop.Setup.*.exe"
                icon: windows
              - name: Linux (deb)
                file_glob: "*amd64.deb"
                icon: linux
