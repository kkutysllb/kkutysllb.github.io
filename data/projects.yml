products:
  - id: dsh-desktop
    name: DSH Desktop
    name_en: DSH Desktop
    parent: deepseek-harness
    tagline: DeepSeek Harness 桌面端 · host & sidecar
    tagline_en: Desktop Host for DeepSeek Harness
    description: |
      DSH Desktop 是 DeepSeek Harness 的 **Electron 桌面端**（host & sidecar）——
      零修改复用上游的 Web UI、API 网关、会话持久化与插件生态，
      自身只负责进程托管、窗口、托盘、上游同步与插件管理的桌面化呈现。

      关键特性：侧车生命周期管理（spawn / 指数退避重启 / 优雅退出）、
      上游一键同步（fetch → `--ff-only` pull → build）、
      GitHub `dsh-plugin` 社区插件管理、VS Code 式内嵌终端（node-pty）、
      electron-updater 自动更新。
    icon: /assets/dsh-desktop.svg
    color: "#4D6BFE"
    versions:
      - id: desktop
        label: 桌面端
        label_en: Desktop
        channels:
          - type: github_release
            releases_file: dsh-desktop.json
            platforms:
