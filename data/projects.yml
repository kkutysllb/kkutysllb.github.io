engines:
  - id: qiongqi
    name: 穷奇引擎
    name_en: QiongQi
    tagline: 独立多 Agent 框架 · 骨架不变，血肉万变
    tagline_en: Independent Multi-Agent Framework
    description: |
      QiongQi（穷奇）是一个领域中立的独立多 Agent 框架，
      以 cache-first、去中心化编排的 HTTP/SSE 引擎为骨架，
      搭配可插拔的技能与工具体系，面向不同行业组装为生产力工具。

      核心目标：提高每一 token 的 ROI。避免重复工具 schema、失控工具输出、
      畸形历史、无效重试，以及任何可以命中却错过的稳定前缀。

      当前能力包括 classic / evented turn orchestration、
      声明式 loop engineering（LoopRunner 解释 LoopPlan phases，
      并通过 Evaluator 做有界 retry）、HTTP/SSE API、A2A task lifecycle、
      Skill/MCP/Web/Memory/Delegation provider、attachments/artifacts、
      hybrid SQLite+JSONL storage、Prometheus metrics、
      structured access logs、OpenTelemetry HTTP tracing，
      以及工具输出预算、bash command audit、virtual path、
      terminal-state guard 等运行治理能力。

      采用 pnpm monorepo 多包结构，共 18 个独立 npm 包（@qiongqi/* 作用域）。
    icon: /assets/qingqi.svg
    color: "#41D1AB"
    repo: kkutysllb/QiongQi
    homepage: https://github.com/kkutysllb/QiongQi
    install:
      - type: git
        label: 克隆源码
        command: git clone https://github.com/kkutysllb/QiongQi.git && cd QiongQi && pnpm install && pnpm -r run build
      - type: pnpm
        label: Monorepo 构建
        command: pnpm install && pnpm -r run build && node scripts/flatten-dist.mjs
    features:
      - title: Cache-first Agent Loop
        desc: immutable prompt prefix、append-only session log、bounded TTL/LRU cache、DeepSeek 原生缓存命中统计，最大化 token ROI
      - title: 去中心化编排
        desc: classic / evented 双模式 orchestrator，支持 A2A task lifecycle 与 SSE 订阅，异步任务提交与轮询
      - title: 声明式 Loop Engineering
        desc: LoopRunner 解释 LoopPlan phases，Evaluator 做有界 retry，灵活可配的 turn 级控制流
      - title: 多 Provider 体系
        desc: Skill / MCP / Web / Memory / Delegation 五大 provider，mcp_search / mcp_describe / mcp_call 渐进式工具发现与加载
      - title: 运行治理
        desc: 工具输出预算控制、bash command audit、virtual path 隔离、terminal-state guard、结构化 access log
      - title: 生产可观测
        desc: Prometheus metrics（token/cache/A2A task/存储诊断）、OpenTelemetry HTTP tracing、health/ready 探针、hybrid SQLite+JSONL 存储

  - id: harness
    name: Harness 架构
    name_en: Harness
    tagline: Super Agent Harness · 让 Agent 完成几乎任何事
    tagline_en: Super Agent Harness
    description: |
      Harness 是一个 Super Agent 编排架构，
      将 Sub-Agents、Memory、Sandbox 和可扩展的 Skills 组织在一起，
      让 Agent 具备真正的任务执行能力。

      核心能力包括动态 Sub-Agent 拆解与并行执行、
      技能与工作模式显式绑定（按需渐进加载）、
      隔离 Sandbox 文件系统、Context Engineering（摘要压缩 + 子任务转存）、
      长期记忆持久化，以及 Token 用量统计与 ROI 分析。
    icon: /assets/oclaw.svg
    color: "#FF6D00"
    features:
      - title: Sub-Agent 编排
        desc: lead agent 动态拆解复杂任务，拉起独立 sub-agents 并行执行，结构化汇总结果
      - title: Skills 与工作模式绑定
        desc: 技能通过 work_modes 显式声明归属，执行时只加载 core + 当前模式技能，节省 token、提升精度
      - title: 隔离 Sandbox
        desc: 每个任务运行在独立 sandbox，完整文件系统（uploads/workspace/outputs），可审计、会隔离
      - title: Context Engineering
        desc: 子任务上下文完全隔离，摘要压缩 + 中间结果转存文件系统，避免上下文膨胀
      - title: 长期记忆
        desc: 对话结束后记忆持久化，跨 session 保留用户偏好、项目知识与历史经验

products:
  - id: oclaw
    name: OClaw
    name_en: OClaw
    parent: harness
    tagline: 桌面端 Super Agent · 覆盖 macOS / Windows / Linux
    tagline_en: Desktop Super Agent
    description: |
      OClaw 是基于 Harness 架构构建的桌面 Super Agent 产品。
      同时提供 macOS / Windows / Linux 三平台安装包，覆盖 Apple Silicon、Intel、AMD64 架构。
    icon: /assets/oclaw.svg
    color: "#E65100"
    versions:
      - id: desktop
        label: 桌面端
        label_en: Desktop
        channels:
          - type: github_release
            releases_file: oclaw.json
            platforms:
              - name: macOS (Apple Silicon)
                file_glob: "*-arm64.dmg"
                icon: apple
              - name: Windows
                file_glob: "OClaw-Setup-*.exe"
                icon: windows
              - name: Linux (deb)
                file_glob: "kkoclaw-desktop_*_amd64.deb"
                icon: linux

  - id: kworks
    name: KWorks
    name_en: KWorks
    parent: qiongqi
    tagline: Local-first AI Workspace · QiongQi 桌面旗舰
    tagline_en: Local-First AI Workspace
    description: |
      KWorks 是一个 Local-first、全栈 AI 工作空间——
      融合 Next.js Web UI、领域中立多 Agent 运行时（QiongQi）
      和 Electron 桌面壳层于一体的自包含产品。

      核心理念：模型是骨架，技能是血肉。运行时保持领域中立，
      同一引擎可随时切换为 coding copilot、研究分析师或创意工作室。
    icon: /assets/kworks.svg
    color: "#00BCD4"
    versions:
      - id: desktop
        label: 桌面端
        label_en: Desktop
        channels:
          - type: github_release
            releases_file: kworks.json
            platforms:
              - name: macOS (Apple Silicon)
                file_glob: "*mac-arm64.*"
                icon: apple
              - name: macOS (Intel)
                file_glob: "*mac-x64.*"
                icon: apple
              - name: Windows
                file_glob: "*-win-x64.exe"
                icon: windows
              - name: Linux
                file_glob: "*.AppImage"
                icon: linux

  - id: kcoder
    name: KCoder
    name_en: KCoder
    parent: qiongqi
    tagline: 面向真实代码库的桌面 AI 编程工作台
    tagline_en: Desktop AI Coding Workbench
    description: |
      KCoder 是一个面向真实代码库的本地桌面 AI 编程工作台。
      以 QiongQi 为唯一运行时，把终端里的智能体体验整理成
      更适合长期开发的应用：选择工作目录，发起任务，
      实时查看推理、工具调用和文件改动，并在需要时审批或回退。

      支持多会话、流式输出、代码审查、计划面板、目标追踪、
      Skill/MCP 图形化管理等完整开发生命周期特性。
    icon: /assets/kcoder.svg
    color: "#7C4DFF"
    versions:
      - id: desktop
        label: 桌面端
        label_en: Desktop
        channels:
          - type: github_release
            releases_file: kcoder.json
            platforms:
              - name: macOS (Apple Silicon)
                file_glob: "*mac-arm64.*"
                icon: apple
              - name: macOS (Intel)
                file_glob: "*mac-x64.*"
                icon: apple
              - name: Windows
                file_glob: "*-win-x64.exe"
                icon: windows
              - name: Linux
                file_glob: "*.AppImage"
                icon: linux
