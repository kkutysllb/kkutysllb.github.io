engines:
  - id: qilin
    name: 麒麟引擎
    name_en: QiLin
    tagline: 独立多 Agent 框架 · 骨架不变，血肉万变
    tagline_en: Independent Multi-Agent Framework
    description: |
      **QiLin（麒麟）是一个面向生产环境的 Python 智能体运行时引擎**（agent harness engine），基于 LangGraph 构建，将模型调用、工具执行、子智能体协作、沙箱隔离、记忆与可观测性整合在同一个可插拔运行时之内，既可作为嵌入式客户端直接调用，也可以作为独立服务通过 HTTP/SDK 对外暴露。

      **核心目标**：让同一套代码既能在进程内跑（embedded mode），也能在 LangGraph Server 上跑（service mode），最大化每一 token 的 ROI。

      **当前能力**：双模运行时引擎（embedded / service）、子智能体一等公民（独立 checkpoint、token 计量、状态契约，递归调用无需 ad-hoc hack）、可插拔沙箱（`local` / `aio_sandbox` / `boxlite` / `e2b` / `tenki` 五种执行后端）、多后端持久化（SQLite 开发态 + PostgreSQL 生产态，含 Alembic 迁移）、基于 Casbin 的资源级 RBAC、双追踪观测（Langfuse + Monocle 同源推送）、Skill Marketplace（Markdown 技能包 + 双层审阅 + `skillscan` 静态扫描）、配置签名触发的热重载、MCP / ACP 协议接入、Textual TUI 终端界面以及 GitHub / GitLab / Notion / Slack 等外部集成。

      Python 包名 `qilin`，CLI 命令 `qilin` / `qilin-serve`，要求 Python >= 3.12。
    icon: /assets/qilin.svg
    color: "#41D1AB"
    repo: kkutysllb/QiLin
    homepage: https://github.com/kkutysllb/QiLin
    install:
      - type: pip
        label: 安装核心包
        command: pip install qilin
      - type: extras
        label: 可选扩展
        command: pip install 'qilin[postgres]' 'qilin[redis]' 'qilin[tui]' 'qilin[boxlite]' 'qilin[monocle]' 'qilin[browser]'
      - type: git
        label: 克隆源码
        command: git clone https://github.com/kkutysllb/QiLin.git && cd QiLin && pip install -e .
    features:
      - title: 双模运行时引擎
        desc: 同一套代码同时支持 embedded 模式（进程内 LangGraph 执行器）与 service 模式（LangGraph Server 部署），运行时按场景无缝切换
      - title: 子智能体一等公民
        desc: 子智能体拥有独立 checkpoint、token 计量与状态契约，递归调用不需要 ad-hoc hack，结构化协作
      - title: 可插拔沙箱（5 种）
        desc: 同一接口下抽象 local / aio_sandbox / boxlite / e2b / tenki 五种执行后端，按隔离级别与场景自由切换
      - title: 多后端持久化 + RBAC
        desc: SQLite（开发）与 PostgreSQL（生产）同一仓储接口，内置 Alembic 迁移；基于 Casbin 的资源级 RBAC 授权
      - title: 双追踪观测
        desc: 同一 trace 同时往 Langfuse 与 Monocle 推送观测数据，开发态与生产态观测体验一致
      - title: Skill 市场 + MCP/ACP
        desc: Markdown 技能包 + 双层审阅 + skillscan 安全静态扫描；MCP 接入外部工具、ACP 跨进程智能体调用

  - id: kskills
    name: KSkills 技能包
    name_en: KSkills
    tagline: 跨平台技能仓库 · {N} 个开箱即用技能
    tagline_en: Cross-Platform Skill Pack Collection — {N} skills
    description: |
      **KSkills 是一套跨平台的技能包（Skill Pack）集合**，可安装到 Claude Code / OClaw / Qoder 等任意 Agent 平台。

      共收录 **{packs} 个技能包 / {files} 个 SKILL.md**，覆盖 6 大领域（数据由 GitHub Actions 自动同步自 KSkills 仓库，详见 `data/kskills.json`）。

      每个技能以 `SKILL.md`（YAML frontmatter + Markdown 指南）为唯一入口，支持独立打包为 `.skill` 压缩包，通过 `SKILL-MANIFEST.json` 校验分发。
    icon: /assets/kskills.svg
    color: "#FFB300"
    repo: kkutysllb/KSkills
    homepage: https://github.com/kkutysllb/KSkills
    features:
      - title: 软件工程
        category_id: coding
        desc: 覆盖软件交付全生命周期：需求、设计、编码、测试、审查、发布、运维
      - title: 金融量化
        category_id: stock
        desc: A 股/港股/美股/期货/期权，含 kk-common 统一数据客户端、十五维一体个股分析等
      - title: 办公文档
        category_id: office
        desc: Word / Excel / PowerPoint / PDF / Slidev / Slack GIF / 文档协作 / Microsoft Foundry 模型部署
      - title: 内容创作
        category_id: media
        desc: 知识漫画、图像、音乐、播客、视频生成技能
      - title: 跨领域公共
        category_id: common
        desc: 结构化分析报告、26 种图表可视化、Markdown 转 HTML
      - title: 深度研究
        category_id: research
        desc: 深度网络研究、学术论文审阅、咨询报告生成
      - title: 标注化打包分发
        desc: .skill 压缩包 + SKILL-MANIFEST.json（含 sha256）、安装器校验解压路径，可安装到任意平台

products:
  - id: kworks
    name: KWorks
    name_en: KWorks
    parent: qilin
    tagline: Local-first AI Workspace · QiLin 桌面旗舰
    tagline_en: Local-First AI Workspace
    description: |
      KWorks 是一个 Local-first、全栈 AI 工作空间——
      融合 Next.js Web UI、Python Agent 运行时（QiLin）
      和 Electron 桌面壳层于一体的自包含产品。

      核心理念：模型是骨架，技能是血肉。运行时保持领域中立，
      同一引擎可随时切换为 coding copilot、研究分析师或创意工作室。
    icon: /assets/kworks.svg
    color: "#00BCD4"
    versions:
      - id: desktop
        label: 桌面端
        label_en: Desktop
        channels:
          - type: github_release
            releases_file: kworks.json
            platforms:
              - name: macOS (Apple Silicon)
                file_globs: ["*-mac-arm64.dmg", "*-arm64.dmg"]
                icon: apple
              - name: Windows
                file_globs: ["*-win-x64.exe", "KWorks.Setup.*.exe"]
                icon: windows
              - name: Linux (deb)
                file_glob: "*amd64.deb"
                icon: linux
              - name: Linux (rpm)
                file_glob: "*.x86_64.rpm"
                icon: linux

  - id: kstock
    name: KStock
    name_en: KStock
    parent: qilin
    tagline: 跨平台桌面股票量化智能体 · 研究/分析/报告
    tagline_en: Cross-Platform Stock Quant Agent
    description: |
      KStock 是一个跨平台桌面端股票量化智能体，
      核心引擎使用 QiLin，技能体系只保留适合研究、分析、报告的精选技能。

      Tauri + React 桌面壳，Python 侧车承载量化引擎，
      面向 A 股 / 港股 / 美股等市场的量化研究与决策支持。
    icon: /assets/kstock.svg
    color: "#E53935"
    versions:
      - id: desktop
        label: 桌面端
        label_en: Desktop
        channels:
          - type: github_release
            releases_file: kstock.json
            platforms:
              - name: macOS (Apple Silicon)
                file_globs: ["*_aarch64.dmg", "*-arm64.dmg"]
                icon: apple
              - name: Windows
                file_globs: ["*_x64-setup.exe", "KStock.Setup.*.exe"]
                icon: windows
              - name: Linux (deb)
                file_glob: "*_amd64.deb"
                icon: linux
              - name: Linux (rpm)
                file_glob: "*.x86_64.rpm"
                icon: linux
