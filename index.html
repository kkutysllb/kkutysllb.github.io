<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="kkutysllb 的作品集：QiLin（麒麟）—— 独立多 Agent 框架，cache-first、去中心化编排的 HTTP/SSE 引擎，以及基于它构建的产品。" />
  <title>kkutysllb · QiLin — 独立多 Agent 框架</title>
  <link rel="icon" href="./assets/avatar.svg" />
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('krelease-theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
  <div class="container">

    <!-- 顶部导航 -->
    <nav class="nav">
      <a class="brand" href="./index.html">
        <img src="./assets/avatar.svg" alt="avatar" />
        <span id="brand-name">kkutysllb</span>
      </a>
      <div class="nav-actions">
        <div class="links">
          <a id="nav-github" href="https://github.com/kkutysllb" target="_blank" rel="noopener">GitHub</a>
          <a href="#engines">引擎</a>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到浅色主题" aria-pressed="false" title="切换主题">
          <svg class="theme-icon sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77" />
          </svg>
          <svg class="theme-icon moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.25 14.8A8.5 8.5 0 0 1 9.2 3.75 8.5 8.5 0 1 0 20.25 14.8Z" />
          </svg>
        </button>
      </div>
    </nav>

    <!-- Hero 区 -->
    <section class="hero">
      <h1 id="hero-title">麒麟启瑞，破局之锋</h1>
      <p class="tagline" id="hero-tagline">独立多 Agent 框架 · 骨架不变，血肉万变</p>
      <p class="bio" id="hero-bio"></p>
      <div class="hero-cover">
        <img src="./assets/qilin.png" alt="QiLin — 麒麟" />
      </div>
    </section>

    <!-- 引擎区块：每个引擎一张大卡片，下方挂载其产品 -->
    <section class="section" id="engines">
      <div class="section-title">
        <h2>基础引擎</h2>
        <span class="count" id="engines-count"></span>
      </div>
      <div id="engines-container"></div>
    </section>

    <footer class="footer">
      <div>© <span id="footer-year"></span> kkutysllb · 本页源码遵循 MIT 协议</div>
      <div class="links">
        <a href="https://github.com/kkutysllb" target="_blank" rel="noopener">GitHub</a>
        <a id="footer-feed" href="https://github.com/kkutysllb" target="_blank" rel="noopener">Releases</a>
      </div>
    </footer>

  </div>

  <script type="module">
    // ============================================================
    // 工具函数
    // ============================================================

    /** 读取 YAML 数据 */
    async function loadYAML(url) {
      const text = await fetch(url).then(r => r.text());
      return jsyaml.load(text);
    }

    /** 读取 release JSON 数据（可能未生成，做空对象容错） */
    async function loadJSON(url) {
      try {
        const res = await fetch(url);
        if (!res.ok) return { assets: [] };
        return await res.json();
      } catch (_) {
        return { assets: [] };
      }
    }

    /** 读取 KSkills 动态元数据（失败时返回 null，调用方静默降级） */
    async function loadKSkills() {
      try {
        const res = await fetch('./data/kskills.json');
        if (!res.ok) return null;
        return await res.json();
      } catch (_) {
        return null;
      }
    }

    /** 渲染引擎描述（支持段落分隔 + 加粗 + inline code） */
    function renderDescription(desc) {
      if (!desc) return '';
      const escape = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      // 按空行分段
      const paragraphs = desc.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
      return paragraphs.map(p => {
        // 段内单换行折叠为空格
        let html = escape(p).replace(/\n/g, ' ');
        // 包围加粗：**xxx**  → <strong>xxx</strong>
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        // 行内代码：`xxx`  → <code>xxx</code>
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        return `<p>${html}</p>`;
      }).join('');
    }

    /** 把 glob 模式转成正则 */
    function globToRegex(glob) {
      const escaped = glob.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*');
      return new RegExp(`^${escaped}$`);
    }

    /** 在 release assets 中匹配 file_glob（支持字符串或数组） */
    function matchAsset(assets, fileGlob) {
      if (!assets || !Array.isArray(assets)) return null;
      const globs = Array.isArray(fileGlob) ? fileGlob : [fileGlob];
      const regs = globs.map(g => globToRegex(g));
      return assets.find(a => regs.some(re => re.test(a.name))) || null;
    }

    /** 格式化字节大小 */
    function fmtSize(bytes) {
      if (!bytes) return '';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0; let n = bytes;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n < 10 ? 1 : 0)} ${units[i]}`;
    }

    /** 将平台名称拆成主名称与架构/格式说明，便于统一排版 */
    function formatPlatformName(name) {
      const match = name.match(/^(.+?)\s*\((.+)\)$/);
      if (!match) return { title: name, detail: '' };
      return { title: match[1], detail: match[2] };
    }

    /** 复制文本到剪贴板 */
    function copyText(text) {
      navigator.clipboard?.writeText(text).catch(() => {});
    }

    const THEME_KEY = 'krelease-theme';

    function currentTheme() {
      return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
    }

    function applyTheme(theme, persist = false) {
      const nextTheme = theme === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nextTheme;
      document.documentElement.style.colorScheme = nextTheme;
      if (persist) {
        try { localStorage.setItem(THEME_KEY, nextTheme); } catch (_) {}
      }

      const toggle = document.getElementById('theme-toggle');
      if (!toggle) return;
      const isLight = nextTheme === 'light';
      toggle.setAttribute('aria-pressed', String(isLight));
      toggle.setAttribute('aria-label', isLight ? '切换到深色主题' : '切换到浅色主题');
      toggle.title = isLight ? '切换到深色主题' : '切换到浅色主题';
    }

    // ============================================================
    // 渲染器
    // ============================================================

    function renderHero(profile) {
      document.getElementById('hero-title').textContent = profile.tagline_zh || profile.tagline || '';
      document.getElementById('hero-tagline').textContent = profile.name + ' · 独立多 Agent 框架';
      document.getElementById('hero-bio').textContent = profile.bio_zh || profile.bio || '';
    }

    function renderInstallCmds(engine) {
      if (!engine.install || engine.install.length === 0) return '';
      return engine.install.map(item => `
        <div class="install-cmd">
          <code>${item.command}</code>
          <span class="copy" data-copy="${item.command}">复制</span>
        </div>
      `).join('');
    }

    function renderFeatures(features) {
      if (!features || features.length === 0) return '';
      return `
        <div class="features">
          ${features.map(f => `
            <div class="feature">
              <div class="t">${f.title}</div>
              <div class="d">${f.desc}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    /** 渲染下载列表（github_release 渠道） */
    function renderReleaseChannel(channel, releases, product) {
      const platforms = channel.platforms || [];
      const rows = platforms.map(plat => {
        // 兼容 file_glob（字符串）与 file_globs（数组）
        const asset = matchAsset(releases.assets, plat.file_globs || plat.file_glob);
        const platform = formatPlatformName(plat.name);
        const platIcon = plat.icon
          ? `<span class="plat-icon"><img src="./assets/platforms/${plat.icon}.svg" alt="${plat.icon}" /></span>`
          : '<span class="plat-icon"></span>';
        const platformLabel = `
          <span class="plat">
            ${platIcon}
            <span class="plat-copy">
              <span class="plat-name">${platform.title}</span>
              ${platform.detail ? `<span class="plat-detail">${platform.detail}</span>` : ''}
            </span>
          </span>
        `;
        const size = asset ? fmtSize(asset.size) : '';
        const sizeLabel = size ? `<span class="download-size">${size}</span>` : '';
        if (asset) {
          return `
            <div class="dl-row">
              ${platformLabel}
              <a class="btn primary download-btn" href="${asset.browser_download_url}" target="_blank" rel="noopener">
                <span>下载</span>${sizeLabel}
              </a>
            </div>
          `;
        }
        return `
          <div class="dl-row unavailable">
            ${platformLabel}
            <span class="disabled">尚未发布</span>
          </div>
        `;
      }).join('');

      const version = releases.tag_name ? `<code>${releases.tag_name}</code>` : '';
      return `
        <div class="dl-list">
          ${version ? `<div class="release-meta">最新版本：${version}</div>` : ''}
          ${rows}
          ${(releases.html_url && product.repo) ? `<a class="repo-link release-link" href="${releases.html_url}" target="_blank" rel="noopener">查看全部历史版本 →</a>` : ''}
        </div>
      `;
    }

    /** 渲染下载列表（repo_preview 渠道） */
    function renderPreviewChannel(channel) {
      return `
        <div class="dl-list">
          <div class="dl-row preview-row">
            <span class="plat">
              <span class="plat-icon"></span>
              <span class="plat-copy">
                <span class="plat-name">${channel.label}</span>
              </span>
            </span>
            <a class="btn primary download-btn" href="${channel.url}" target="_blank" rel="noopener">查看</a>
          </div>
          ${channel.note ? `<div class="preview-note">${channel.note}</div>` : ''}
        </div>
      `;
    }

    /** 渲染单个产品卡片 */
    function renderProduct(product, releasesMap) {
      const versions = product.versions || [];
      // 默认激活第一个版本
      const versionData = versions.map((v, idx) => ({ v, idx }));

      return `
        <div class="product" style="--accent-bar: ${product.color || '#fff'}">
          <div class="head">
            <img src="${product.icon}" alt="${product.name}" />
            <h4>${product.name}</h4>
            ${product.repo ? `<span class="repo">${product.repo}</span>` : ''}
          </div>
          <p class="tagline">${product.tagline || ''}</p>

          ${versions.length > 0 ? `
            <div class="version-tabs" data-product="${product.id}">
              ${versionData.map(({ v, idx }) => `
                <div class="tab ${idx === 0 ? 'active' : ''}" data-version-idx="${idx}">
                  ${v.label}
                </div>
              `).join('')}
            </div>
            <div class="version-bodies">
              ${versionData.map(({ v, idx }) => `
                <div class="version-body" data-version-idx="${idx}" style="${idx === 0 ? '' : 'display:none'}">
                  ${renderVersionChannels(product, v, releasesMap)}
                </div>
              `).join('')}
            </div>
          ` : '<div style="font-size:13px;color:var(--fg-dim)">即将推出</div>'}

          ${product.homepage ? `<a class="repo-link" href="${product.homepage}" target="_blank" rel="noopener">${product.repo} →</a>` : ''}
        </div>
      `;
    }

    function renderVersionChannels(product, version, releasesMap) {
      return version.channels.map(ch => {
        if (ch.type === 'github_release') {
          const releases = releasesMap[ch.releases_file] || { assets: [] };
          return renderReleaseChannel(ch, releases, product);
        }
        if (ch.type === 'repo_preview') {
          return renderPreviewChannel(ch);
        }
        return '';
      }).join('');
    }

    /** 渲染引擎卡片（含其下挂载的产品） */
    function renderEngine(engine, children, releasesMap) {
      return `
        <div class="engine">
          <div class="engine-head">
            <img class="icon" src="${engine.icon}" alt="${engine.name}" />
            <div style="flex:1">
              <h3>${engine.name} <span style="color:var(--fg-dim);font-size:14px;font-weight:400">· ${engine.name_en}</span></h3>
              <p class="sub">${engine.tagline || ''}</p>
              <p class="desc">${renderDescription(engine.description)}</p>
              <div class="engine-actions">
                ${engine.homepage ? `<a class="btn primary" href="${engine.homepage}" target="_blank" rel="noopener">查看仓库</a>` : ''}
              </div>
              ${renderInstallCmds(engine)}
            </div>
          </div>

          ${renderFeatures(engine.features)}

          ${children.length > 0 ? `
            <div class="products-sub">
              <div class="label">基于 ${engine.name} 构建的产品 · ${children.length}</div>
              <div class="products-grid">
                ${children.map(p => renderProduct(p, releasesMap)).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ============================================================
    // 事件绑定
    // ============================================================

    function bindEvents() {
      // 版本切换
      document.body.addEventListener('click', (e) => {
        const themeToggle = e.target.closest('#theme-toggle');
        if (themeToggle) {
          applyTheme(currentTheme() === 'light' ? 'dark' : 'light', true);
          return;
        }

        const tab = e.target.closest('.version-tabs .tab');
        if (!tab) return;
        const tabsRoot = tab.parentElement;
        const productId = tabsRoot.dataset.product;
        const idx = tab.dataset.versionIdx;
        tabsRoot.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const productRoot = tabsRoot.closest('.product');
        productRoot.querySelectorAll('.version-body').forEach(b => {
          b.style.display = (b.dataset.versionIdx === idx) ? '' : 'none';
        });
      });

      // 复制安装命令
      document.body.addEventListener('click', (e) => {
        const c = e.target.closest('.copy');
        if (!c) return;
        copyText(c.dataset.copy);
        const orig = c.textContent;
        c.textContent = '已复制';
        setTimeout(() => { c.textContent = orig; }, 1200);
      });
    }

    // ============================================================
    // 主流程
    // ============================================================

    async function main() {
      applyTheme(currentTheme());
      document.getElementById('footer-year').textContent = new Date().getFullYear();

      let data;
      try {
        data = await loadYAML('./data/projects.yml');
      } catch (err) {
        document.getElementById('engines-container').innerHTML =
          `<div style="color:var(--fg-dim);padding:32px">数据加载失败：${err.message}</div>`;
        return;
      }

      // KSkills 动态元数据：占位符替换 + 分类数量自动注入
      const kskills = await loadKSkills();
      if (kskills) {
        const t = kskills.totals || {};
        const fillTpl = (s) => (s || '')
          .replace(/\{N\}/g, t.skill_packs ?? '?')
          .replace(/\{packs\}/g, t.skill_packs ?? '?')
          .replace(/\{files\}/g, t.skill_md ?? '?');
        data.engines.forEach(eng => {
          if (eng.id !== 'kskills') return;
          eng.tagline = fillTpl(eng.tagline);
          eng.tagline_en = fillTpl(eng.tagline_en);
          eng.description = fillTpl(eng.description);
          const catMap = Object.fromEntries((kskills.categories || []).map(c => [c.id, c]));
          eng.features = (eng.features || []).map(f => {
            if (!f.category_id) return f;
            const cat = catMap[f.category_id];
            if (!cat) return f;
            const suffix = cat.skill_md_count > cat.pack_count
              ? `${cat.pack_count} 包 / ${cat.skill_md_count} SKILL.md`
              : `${cat.pack_count} 个`;
            return { ...f, title: `${f.title}（${suffix}）` };
          });
        });
      }

      const { profile, engines, products } = data;

      // Hero
      renderHero(profile);

      // 预加载所有 release 数据
      const releaseFiles = new Set();
      products.forEach(p => (p.versions || []).forEach(v =>
        (v.channels || []).forEach(c => {
          if (c.type === 'github_release' && c.releases_file) releaseFiles.add(c.releases_file);
        })
      ));
      const releasesMap = {};
      await Promise.all([...releaseFiles].map(async f => {
        releasesMap[f] = await loadJSON(`./data/releases/${f}`);
      }));

      // 引擎
      document.getElementById('engines-count').textContent = `${engines.length} engines`;
      const enginesContainer = document.getElementById('engines-container');
      enginesContainer.innerHTML = engines.map(engine => {
        const children = products.filter(p => p.parent === engine.id);
        return renderEngine(engine, children, releasesMap);
      }).join('');

      bindEvents();
    }

    main();
  </script>
</body>
</html>
